<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <div class="w-full max-w-sm rounded border border-gray-300 bg-white p-8 text-center shadow-sm">
    @if (isSuccess()) {
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-green-700">
        ✓
      </div>
    } @else {
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-700">
        ✕
      </div>
    }

    <h1 class="text-xl font-semibold text-gray-900">{{ title() }}</h1>
    <p class="mt-2 text-sm text-gray-600">{{ message() }}</p>
  </div>
</div>
