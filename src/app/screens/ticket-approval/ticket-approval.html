<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <div class="w-full max-w-md rounded border border-gray-300 bg-white p-8 shadow-sm">
    <p class="text-sm text-gray-500">Organización</p>
    <p class="mt-1 text-lg font-semibold text-gray-900">{{ organization() }}</p>

    <p class="mt-6 text-sm text-gray-500">Ticket</p>
    <p class="mt-1 text-lg font-semibold text-gray-900">#{{ ticketNumber() }}</p>

    <div class="mt-8 flex gap-3">
      <button
        (click)="approve()"
        class="flex-1 rounded bg-green-700 px-4 py-2 text-sm font-medium text-white hover:bg-green-800"
      >
        Aprobar
      </button>
      <button
        (click)="decline()"
        class="flex-1 rounded bg-red-700 px-4 py-2 text-sm font-medium text-white hover:bg-red-800"
      >
        Rechazar
      </button>
    </div>
  </div>
</div>
