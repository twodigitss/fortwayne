<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light dark; }
  html, body { height: 100%; }
</style>

<main class="min-h-full flex items-center justify-center p-4">
  <section class="w-full max-w-md rounded-xl bg-white border border-slate-200 shadow-sm p-6">

    <h1 class="text-xl font-semibold">Descargar reporte</h1>
    <p class="mt-1 text-sm text-slate-500"> una opción del catálogo y descarga el Excel.</p>

    <label class="mt-6 block text-sm font-medium">Catálogo</label>

    <div class="relative mt-1.5">

      <select
        #miSelect
        (change)="alSeleccionar(miSelect.value)"
        class="w-full appearance-none rounded-lg border border-slate-300  bg-white  px-3 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <option disabled selected >Selecciona una opción</option>
        <option *ngFor="let opt of catalogo()" [value]="opt">{{opt}}</option>
      </select>
      <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
    </div>

    <button
      type="button"
      [disabled]="disableDownload()"
      (click)="downloadFile()"
      [ngClass]="stylesByState()"
      class="mt-5 w-full inline-flex items-center justify-center rounded-lg px-4 py-2.5 text-sm font-medium transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2 "
    >

      <svg *ngIf="appState() == 'idle' || appState() == 'ready' " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-table w-5 h-5">
      	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
      	<path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" />
      	<path d="M3 10h18" />
      	<path d="M10 3v18" />
      </svg>

      <svg *ngIf="appState() == 'loading' " viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" >
        <style>
          @keyframes loader2{0%{-webkit-transform:rotate(0);transform:rotate(0)}to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}
        </style>
        <path fill="currentColor" d="M17.179 13.605a.431.431 0 00.279.514l.775.245a.393.393 0 00.499-.268 7.318 7.318 0 00-4.5-8.658.39.39 0 00-.507.255l-.245.775a.43.43 0 00.261.523 5.69 5.69 0 013.438 6.614z" style="animation:loader2 1s cubic-bezier(.63,-.71,.32,1.28) infinite both;transform-origin:center center"/>
      </svg>

      <svg *ngIf="appState() == 'done'" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"><style>@keyframes check {
        to { stroke-dashoffset: 0; } }</style><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M9.215 12.052l1.822 1.805 3.748-3.714" style="animation:check 2s infinite cubic-bezier(.99,-.1,.01,1.02)" stroke-dashoffset="100" stroke-dasharray="100"/></svg>

      <span id="label">{{label()}}</span>
    </button>

    <p id="status" role="status" aria-live="polite" class="mt-3 min-h-5 text-sm text-slate-500 "></p>
  </section>
</main>
